<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!--
      Size: the 3rd value of camera-orbit is the camera distance.
      100% = default framing. Higher = bottle looks smaller (try 150%–250%).
    -->
    <model-viewer
        id="bottle"
        src="Oryn.glb"
        camera-controls
        auto-rotate
        camera-orbit="0deg 75deg 180%"
        max-camera-orbit="Infinity 180deg 300%"
        environment-image="neutral"
        shadow-intensity="1"
        shadow-softness="0.8"
        exposure="0.75"
        tone-mapping="aces">
    </model-viewer>

    <script type="module">
        // Green sampled from the product photo. Adjust to taste.
        const BODY_COLOR = '#9FC39D';

        const viewer = document.getElementById('bottle');

        viewer.addEventListener('load', () => {
            for (const mat of viewer.model.materials) {
                const pbr = mat.pbrMetallicRoughness;

                // Skip the metal cap so it stays silver
                if (pbr.metallicFactor > 0.5) continue;

                // Tint the body green. Its texture is kept, so the surface detail stays.
                pbr.setBaseColorFactor(BODY_COLOR);
            }
        });
    </script>

</body>
</html>
